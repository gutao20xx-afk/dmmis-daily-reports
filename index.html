<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DMMIS 每日决策简报</title>
  <style>
    :root{--ink:#13201b;--muted:#607069;--line:#dbe4df;--paper:#fff;--wash:#f2f6f4;--accent:#0f6957;--accent-soft:#dff1eb}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#eef5f2 0,#f8faf9 48%,#edf3f0 100%);color:var(--ink);font:16px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh}
    main{width:min(940px,calc(100% - 32px));margin:0 auto;padding:56px 0 72px}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:.82rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.08;letter-spacing:-.035em;margin:0 0 16px}.lede{max-width:680px;color:var(--muted);font-size:1.05rem;margin:0 0 34px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;min-height:230px;padding:24px;background:color-mix(in srgb,var(--paper) 94%,transparent);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px rgba(23,54,43,.08)}.card h2{margin:0 0 8px;font-size:1.35rem}.card p{margin:0;color:var(--muted)}.meta{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}.button{display:inline-flex;align-items:center;justify-content:center;width:max-content;margin-top:auto;padding:11px 16px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800}.button:focus-visible{outline:3px solid #72b5a5;outline-offset:3px}.archive{margin-top:28px;padding:20px 22px;background:var(--paper);border:1px solid var(--line);border-radius:14px}.archive a{color:var(--accent);font-weight:700}.archive ul{margin:8px 0 0;padding-left:22px}
    @media(max-width:680px){main{padding-top:34px}.grid{grid-template-columns:1fr}.card{min-height:210px}}
  </style>
</head>
<body><main><p class="eyebrow">DMMIS × SIGNAL</p><h1>每日决策简报</h1>
<p class="lede">按日期访问 DMMIS 决策简报与 Signal 每日工作台。报告是不可变快照，便于邮件链接、复核和追溯。</p>
<section class="grid" aria-label="最新简报">
  <article class="card"><h2>最新日报</h2><p>2026-09-06 联合更新已归档。</p><a class="button" href="./daily/2026-09-06/">打开日报</a></article>
  <article class="card"><h2>固定链接</h2><p>每个日期包含独立的 DMMIS 与 Signal 页面，后续更新不会覆盖历史内容。</p><a class="button" href="./daily/2026-09-06/signal/">查看最新 Signal</a></article>
</section>
<section class="archive"><strong>历史日期</strong><ul><li><a href="./daily/2026-09-06/">2026-09-06</a></li></ul></section></main></body>
</html>
